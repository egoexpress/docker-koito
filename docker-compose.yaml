services:
  app:
    image: gabehf/koito:v0.3
    restart: unless-stopped
    volumes:
      - data:/etc/koito
    networks:
      - frontend
    environment:
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - ACME_HOST=${VIRTUAL_HOST}
      - ACME_EMAIL=${ACME_EMAIL}
      - KOITO_LOG_LEVEL=warn
      - KOITO_CORS_ALLOWED_ORIGINS=*

volumes:
  data:

networks:
  frontend:
    name: proxy_frontend
    external: true
