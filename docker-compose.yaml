services:
  app:
    image: gabehf/koito:v0.3
    restart: unless-stopped
    volumes:
      - data:/etc/koito
    networks:
      - frontend
    environment:
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      # Koito listens on 80 (see KOITO_LISTEN_PORT below), but the image only
      # exposes 4110. nginx-proxy would otherwise route to the exposed port.
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=${VIRTUAL_HOST}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - KOITO_LISTEN_PORT=80
      - KOITO_LOG_LEVEL=warn
      - KOITO_CORS_ALLOWED_ORIGINS=*

volumes:
  data:

networks:
  frontend:
    name: proxy_frontend
    external: true
