name: publish-image

on:
  push:
    branches:
      - main
    paths:
      - "image/**"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: image
          push: true
          build-args: |
            KOITO_VERSION=0.3.2-pr382
          tags: |
            ghcr.io/${{ github.repository }}:0.3.2-pr382
            ghcr.io/${{ github.repository }}:pr382
